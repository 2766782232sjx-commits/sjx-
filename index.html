}

function payMid(p){ const s=String(p); const m=s.match(/(\d+)[-–~](\d+)/); if(m) return (+m[1]+ +m[2])/2; const one=s.match(/(\d+)/); return one?+one[1]:12; }
function scoreParts(j){
  const txt = (j.pro||'')+(j.con||'');
  return {
    fit: Math.round(j.fit/5*40),
    pay: Math.round(Math.min(payMid(j.pay),60)/60*30),
    growth: /名额极少|名额更少|晋升慢|晋升难/.test(j.con||'') ? 4 : (/晋升|培养|管培|轮岗|通道|储备|扩编/.test(j.pro||'') ? 13 : 8),
    mob: (/收护照|护照上交|管理严格/.test(txt)?-8:0) + (/外派|驻外|全球|国际/.test(j.pro||'')?7:0) + (/英语|语言|雅思|英文/.test((j.pro||'')+(j.req||''))?4:0)
  };
}
function jobScore(j){ const s=scoreParts(j); return Math.round(s.fit+s.pay+s.growth+s.mob) + ((daysLeft(j.dl)??1)<0 ? -8 : 0); }

      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🏦 银行/证券总行的隐形门槛：</b>国有行总行待遇在央国企总部里中上到上等，但30万是税前且要熬2-3年（税后得4-5年）；证券总部、银行总行校招普遍「需要很硬的关系提前打招呼」，普通家庭直接略过、当彩票投即可——<b>主攻目标城市的省分公司/省会区域总部</b>才现实。另：股份行总行（如招总）薪资更高但强度也更大</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>💬 谈薪别自报低价：</b>心里预期30万也别在谈薪时说出口——北京税前30万扣完税五险一金+房租所剩无几；算法岗市场价通常远不止这个数。预期封死在心底，让公司先出价</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🔮 别迷信「神仙单位」：</b>中债登这类曾经的顶级神仙单位，一年内因权责变更+金融管控就从人人羡慕变成吐槽对象（利润降/福利缩/年终拖）。单位兴衰是动态的，没有一步到位的最优解——先按当下条件选，边干边动态调整优先级</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>👩 女生视角（回帖共识）：</b>市场化国企警惕酒桌文化（陪酒风险真实存在，非市场化央国企好得多）；女生校招走泛体制普遍年20万左右（多的15-18万起步）；生育年龄与大厂晋升期高度重合是真实冲突——权重因人而异，但决策时必须放进公式</div>
      <div style="padding:7px 0"><b>✅ 两条行动铁律：</b>①「都试试，拿到offer再比较」——纠结是选择权充足的奢侈品，先投满再说；②接到泛体制offer后<b>务必联系在职前辈全方位摸底</b>（辅导员/就业中心/XHS某鱼都能建联）：穿衣自由度、A4雕花、琐活烧水、未来5-10年真实薪资能否支撑生活预期——体制内一签多年，信息差值几十万。附：不要美化未曾选择的道路</div>
      </div></details>
    <details class="card" style="border-left:4px solid #00695C;margin-bottom:12px"><summary style="cursor:pointer;font-size:14px;font-weight:700">🧯 国企/京户/选调避坑情报（BBS五帖精选 · 2026-05至08一手回帖）</summary>
      <div style="margin-top:10px;font-size:13px;line-height:1.9;color:#444">
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🏠 京户偏好怎么读：</b>全国单位都爱本地人，北京更特殊——户口约束大于编制约束，招京户=省一个户口指标。规则很清晰：<b>统一招聘（总部校招常见）京户只是优势、非必须项；分岗位招聘明确写限京籍/京户的，非京户直接跳过别浪费时间</b>。不缺户口指标的大型央国企总部对户籍无偏好（学历/性别/年龄/政治面貌权重更大）；部分在京二级单位只招京籍（如中石化在京二级）。冷知识：央企在京单位校招京籍比例需约50%以上外地生才都有户口指标——所以<b>总部外地生机会反而多，北京分公司京人多</b></div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🥕 萝卜坑真相：</b>BBS共识「厅局级长辈才能确保央企总部offer」基本属实，但主体是学历能力达标+家境好的人，真正的硬萝卜是少数；<b>牛马岗（干活岗）反而是普通人的机会</b>——萝卜不爱去、单位也不敢全要萝卜。萝卜还能后天积累：导师/院系/实习/学长学姐资源用好了你也是半个萝卜。行动：多跑就业办、多争取相关实习、投递别只盯总行（盈利和行业不错的央企都报上）</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🛡️ 国企不可能三角：</b>普通人+不用排队+好单位=不可能三角，别信「国企955躺平」的鬼话。央企注意：不适用北京人社局直接落户政策，多走单位集体户+落户协议（服务期常见3年、违约金6位数真实存在）——<b>签落户协议前逐条看清违约条款</b>，那就是日后拿捏你的那根绳</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>⚖️ 国企自保常识（3年维权实录）：</b>国企开除人要上会+追责招聘你的人，所以几乎没人敢真开除——领导赶人靠的是派外地/塞烂活/进降薪名单逼你自己走。铁律：①<b>千万别主动提交离职申请</b>（交了就任人宰割，户口违约金协商筹码全失）；②所有谈话录音、书面往来留备份；③真到撕破脸，躺平正常打卡到合同到期拿N倍赔偿是可行解（楼主硬刚16个月成功拿到）</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🏡 选调回家乡判据：</b>回县城选调的前提是家里在当地有根基（「县城婆罗门」互相帮衬），没背景回去=给婆罗门打杂+北大原罪先被打压服；<b>有背景去艰苦地区是镀金，没背景是发配</b>。女生版共识：大城市对女生更友好，身边留京女生（体制内或互联网）几乎无人后悔，央国企是留京女生最好的一档。中西部省直真实体验：月薪约5000的「窝囊费」+一眼望到头+同事「北大的来这干啥」式惋惜；若转省考赛道，东部省份行测申论是熟练度考试，北大未必考得过地方一本——<b>笔试优势靠刷题量堆，不靠学历</b></div>
      <div style="padding:7px 0"><b>📜 入职后生存法则（北大人版）：</b>体制内公文才算业务能力，PPT/编程只是加分项；别自己创造需求给单位加负担（写了程序没人用是常态）；先「泯然众人」再谈发扬优势；清北学历无背景=双刃剑（有背景重点培养，没背景重点打压）；核心是「唯上」——获得高你至少两级领导的认可；北大tag有二相性，藏器于身、待时而动</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🔄 入职即调岗（2026-09新鲜实例）：</b>校招按好岗位招进去、入职后直接调到普通部门的实例：HR一句话就能办——「合同签了同意<b>服从公司安排</b>」，事后无任何解释说明，不撕破脸基本无解；且社保已交、落户流程已启动，违约金六位数锁死退路。教训三条：①合同里「服从公司安排」条款入职前就要意识到它的分量；②别为单一好岗位撕掉别家offer；③入职后遇调岗，共识处置＝<b>骑驴找马别裸辞 + 先把户口落下来 + 兼职过渡</b>。版友共识：好央企的关系户都不来算什么好央企，没背景的人在平台内拿到的是下限待遇——「丫鬟长工」话难听但规则就是这样，拼平台下限而非内部争资源</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>📉 大厂被裁后怎么办（高赞共识）：</b>信科本科大厂4年被裁的真实提问与高赞回答：①应届身份丢了不必刷学历，<b>直接投国央企社招</b>（北大本科+京户常能特事特办）；②但开放社招的好坑不多（好单位只校招，社招坑要多方打听）；③四大行研发/软开中心作为直属机构「低人一等」且压力不小，不是好退路；④提醒两个反直觉：国央企不一定WLB（互联网身体累、体制内心累）、市场化国央企可能兼有两边缺点（卷赚不到钱+躺躺不平）；⑤无论怎么选，<b>千万别上杠杆买车买房</b>；⑥在职读个在职硕/博也是曲线路径</div>
      <div style="padding:7px 0"><b>💼 国企在职副业实录（文科生视角）：</b>在京国企年包25到手十几个、五点下班，想搞副业的真实尝试：家教机构只要本科生、伴学陪读薪资白菜、求职陪跑卷中之卷、数据标注需求萎缩。有效建议：<b>副业要围绕主业核心技能做咨询/培训</b>（跟主业无关的副业缺乏竞争力）；合法合规红线：国企/事业单位提拔时可能审核工资之外收入（违规兼职/利益冲突/亲属办企业），与部委楼「兼职写作讲学咨询合法（个人事项报告专门有一栏）」对照看——合法副业存在，但要先搞清楚本单位的具体规定</div>
      </div></details>
    <details class="card" style="border-left:4px solid #4A148C;margin-bottom:12px"><summary style="cursor:pointer;font-size:14px;font-weight:700">💰 央国企定价与生存FAQ（BBS问答大合集 · 2025-11至2026-08一手回帖）</summary>
      <div style="margin-top:10px;font-size:13px;line-height:1.9;color:#444">
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>💵 央国企定薪真相（别被网上30W吓到）：</b>在职领导实锤：应届定薪月均约2万税前（年24），所谓起薪30＝把绩效好的年终奖五六万算进去；若单位亏损，普通员工没有这笔年终。年终奖由<b>奖金包分到各部门、部门总决定分你多少，人力根本不知道也说了不算</b>——所以人力报的「1-3个月」听个响。集团利润最高二级单位最好部门，新入职年包也不到20；人文社科起薪25（税前）已算很好的单位。最要命的是：<b>现在央国企合同不写具体金额，写「按企业薪资制度执行」，领导说你多少就是多少</b>（有单位离职当天宣布降薪40%的实例）——入职前务必找在职前辈摸真实到手</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>📉 国企改革末位淘汰真相：</b>2026-2029方案是延续深化，别慌，但分清单位性质：①末等调整/末位淘汰指<b>中层及以上管理人员</b>，普通员工不在射程；②央企总部职能岗走科层制机关路线，已是国央企里最稳的；③金融央企（金监总局监管）几乎没裁过人；④但<b>行业下行时国企照样裁</b>——同时代清北学建筑的进头部设计院/中建X局，现在很多失业在家。结论：怕的不是改革，是行业；选行业比看方案重要</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🏛️ 部委FAQ楼精华：</b>萝卜坑识别法＝岗位要求太细（特定专业+特定履历+特种证书）且惊人地与你条件巧合，大概率挖坑等萝卜；要求看似正常的无法防备但概率极小。晋升现实：<b>应届硕士8年到副处已是一步不耽搁的最快速度</b>；部委里两三个主任科员争一个副处，基层上百个轮不到一个——「基层提拔快」是错觉，中央到点提副处司空见惯。分房：看不到任何不分的可能。北大学历与晋升无因果关系（一半时间正相关、一半时间无关）。社恐/不能喝酒：社交非必须，三五朋友足矣，<b>坚持不喝很快就没人让你喝了</b>（入职近十年当领导秘书一滴没喝过的实例）</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🏦 银行总行管培red flag清单（招总实例）：</b>①连续两年B-会被淘汰（目前未实质执行，但每年几百个总行hc、一个团队大几十人、离职率不低，银行业下行下有实质执行可能）；②业务线管培轮岗已延长至2.5年且增加基层支行时间，定岗分行的概率上升；③管培入职后啥都干（营销/客群/产品/系统），<b>银行培养的能力极难迁移出银行</b>，更像文化浸泡而非市场化能力提升；④心理预期打885。对照组：招总不裁员+数百万员工无息贷款+大头兵能到70-80w+管培易去业务线，仍是匹敌建总的顶级泛体制offer——同一事实两派解读，入职前务必找在职的人问淘汰政策执行度</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🧳 总行轮岗选京内还是京外：</b>BBS压倒性共识选京外——在分行/网点接触不到总行，「混脸熟对定岗有帮助」是幻想（新人做不了需要报总行的业务；真想混脸熟不如省下房租请吃饭）；京外给宿舍、分公司的客客气气当潜在领导供一年、周末旅游爽歪歪，「公司花钱让你旅游一年」再无第二次。进阶认知：<b>社交的基准永远是你的价值，自己比社交重要</b>；以前选北京是为了看房买房等升值，现在这个逻辑已不存在</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🎓 学历定级与「有总选总」：</b>体制内一律能读继续读——本科进去一级科员可能一辈子熬不出来（每个人都是你上司、隐形打压、违规活压给你干），<b>博士进去直接正科</b>、硕士居中；反常识的是本科进去体验最好的反而是部委（风清气正、到点就提、没人因级别低踩你），越往基层越反之。选岗铁律「<b>有总选总</b>」：别去二级三级四级五级单位，都是往届先烈血泪教训；且北京金融+实业央企总部共100多家（实业约70+金融约20+），每年校招大都会来北大开宣讲会，<b>有些金融央企总部入职名单里北大一个都没有（被央财外经贸北邮北理占位）——不是进不去，是贵校学生没认真投，这是现成的信息差红利</b></div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>🥊 省属国资PE vs 垄断国企省局（烟草实例）：</b>省烟草行业腿部省局岗稳定后20+，但不会像省厅到点就提，「干几年四主下县锻炼回来提干部」是领导的画饼话术；省属半垄断国企投资平台（国资PE）能给约30，但<b>绩效占比高达60%</b>（领导称是上面规定），绩效占比高=实际到手波动大、可被调节。在职者结论：<b>绝大多数省属国资PE从稳定性、内部晋升、薪资三维度严格不如烟草</b>，想清闲躺平选垄断国企；省属国资PE之间差别也很大，入职前务必摸清具体平台近三年绩效发放实情</div>
      <div style="border-bottom:1px dashed var(--line);padding:7px 0"><b>⚖️ offer纠结时的通用解：</b>没想好选什么时，同档次offer优先选<b>可进可退</b>的（保留再考公/跳市场化的空间）。反例警示：三类事业编「可进可退」要打折听——事业单位出来能力化严重，跳市场化机构可能性不大，万一去到兼具市场化和体制内双重缺点的岗位更难受，连在职考公的时间都没有；且深圳事业单位多本地户有钱人，压榨外地人多干少得的吐槽不少。另外工作后共识：人大/政协/妇联/残联/工会等「边缘部门」真香，同样的架构下竞争副处的压力小得多</div>
      <div style="padding:7px 0"><b>🧰 找工方法论七关（互联网/外企线通用）：</b>投递优先级＝<b>准老板＞该岗位Recruiter（不是HR Manager）＞校友/朋友内推＞直投</b>；与HR做朋友功利上能推动进程/优先排期/提高议价/失败时给反馈标准；面试备四套文稿（HR面/同辈面/领导面/最高领导面，自我介绍打磨到一分钟内直接朗诵，永不提「学习能力强」）；一旦开面<b>一鼓作气全面完</b>别拖（岗位被先到者占）；面试凉凉可问HR能否把简历转交别的部门；冷冻期一般半年。留京对照：中央遴选笔试的答案是具体可操作（渠道资金/工程名目/试点推进），中办国办报信息原则上不采用缺钱缺人内容；省财政厅真实体验＝稳定穷（到手七八千）+忙是机会+副处之前职级不受任何事影响</div>
      </div></details>
    <details class="card" style="border-left:4px solid #1A237E;margin-bottom:12px"><summary style="cursor:pointer;font-size:14px;font-weight:700">🏛️ 部委问答楼·25-26新鲜情报（楼主系部委保密处长 · 2025-01至2026-07一手回答）</summary>
      <div style="margin-top:10px;font-size:13px;line-height:1.9;color:#444">

function heatOf(j){ const s=String(j.c); for(const k in HEAT_MAP){ if(s.includes(k)) return HEAT_MAP[k]; } return 0; }
function jobListHtml(){
  let list = ALL_JOBS().slice();
  if(curCat!=='all') list = list.filter(j=>j.cat===curCat);
  const q = (JOBSTAT.__q||'').trim();
  if(q) list = list.filter(j=>(j.c+j.r+j.req+(j.base||'')).includes(q));
  const payMin = p => { const m=String(p).match(/(\d+)[-–]/); return m?+m[1]:0; };
  if(curSort==='score') list.sort((a,b)=>jobScore(b)-jobScore(a));
  if(curSort==='dl') list.sort((a,b)=>(daysLeft(a.dl)??999)-(daysLeft(b.dl)??999));
  if(curSort==='fit') list.sort((a,b)=>b.fit-a.fit);
  if(curSort==='pay') list.sort((a,b)=>payMin(b.pay)-payMin(a.pay));
  if(!list.length) return '<div class="empty">没有匹配的岗位</div>';
  return list.map(j=>{
    const cat = CATS[j.cat], d = daysLeft(j.dl), st = APPS[j.id]?.status||0, h = heatOf(j);
    const dlHtml = d===null ? esc(j.dlNote||j.dl) :
      d<0 ? `<span style="color:#999">已过期(参考)</span>` :
      `<span class="${d<=14?'dl-soon':''}">${j.dl}（剩${d}天）</span>`;
    return `<div class="job" style="--jc:${cat.color}" onclick="this.classList.toggle('open')">
      <div class="top"><span class="comp">${esc(j.c)}</span><span class="role">${esc(j.r)}</span>
        <span class="cat-tag">${cat.name}</span><span class="fit">${'★'.repeat(j.fit)}${'☆'.repeat(5-j.fit)}</span>
        <span class="cat-tag" style="background:#1d1d1f">🎯 ${jobScore(j)}分</span>
        ${h>=3?`<span class="cat-tag" style="background:${h>=5?'#B71C1C':'#E65100'}" title="竞争激烈度：基于转正率/报录比/HC情报">🔥×${h}</span>`:''}
        ${/外派|驻外|海外派驻|常驻海外|接受出国|全球轮岗|海外基地/.test((j.pro||'')+(j.req||'')+(j.r||''))?`<span class="cat-tag" style="background:#0277BD">✈ 外派</span>`:''}
        ${j.custom?`<span class="cat-tag" style="background:#555" onclick="event.stopPropagation();delCustom('${j.id}')">我加的 ✕</span>`:''}</div>
      <div class="meta">截止：<b>${dlHtml}</b> ｜ 考试：<b>${j.exam?'✅ '+esc(j.examInfo.slice(0,22))+(j.examInfo.length>22?'…':''):'❌ 无统一笔试'}</b> ｜ 待遇：<b>${esc(j.pay)}</b> ｜ Base：<b>${esc(j.base||'—')}</b></div>
      ${j.flag?`<div class="meta" style="color:#B71C1C;background:#fdf0ef;border-radius:8px;padding:4px 8px;margin-top:4px">${esc(j.flag)}</div>`:''}
      <div class="detail">
        <p><span class="lb">报名条件</span>${esc(j.req)}</p>
        <p><span class="lb">考试安排</span>${esc(j.examInfo)}</p>
        <p><span class="lb">投递通道</span><a href="${j.url.startsWith('http')?j.url:'javascript:void(0)'}" ${j.url.startsWith('http')?'target="_blank"':''} style="color:#1565C0">${esc(j.url)}</a> <span style="color:#999;font-size:12px">（${esc(j.src)}）</span></p>
        <p><span class="lb">待遇</span>${esc(j.pay)}</p>
        <p><span class="lb">匹配分</span><b>${jobScore(j)}</b>＝契合度${scoreParts(j).fit}+薪资${scoreParts(j).pay}+成长${scoreParts(j).growth}+语言外派${scoreParts(j).mob}${(daysLeft(j.dl)??1)<0?'−已截止8':''}（满分约94，仅作排序参考）</p>
        <div class="flexrow" onclick="event.stopPropagation()"><span class="lb" style="margin-top:2px">优劣势</span>
          <div class="fitbox"><p class="pro">✓ ${esc(j.pro)}</p><p class="con">△ ${esc(j.con)}</p>
          <p style="color:#999;font-size:12px">🔎 小红书/牛客检索词：<b>${esc(j.kw)}</b></p></div></div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap" onclick="event.stopPropagation()">
          <span>我的状态：</span><select onchange="setStatus('${j.id}',this.value)">
            ${STATUS.map((s,i)=>`<option value="${i}" ${st===i?'selected':''}>${s}</option>`).join('')}</select>
          <a class="btn small sec" href="javascript:void(0)" onclick="goSched('${j.id}')">📝 记考试/面试时间</a>
        </div>
      </div></div>`;
  }).join('');
}
function setStatus(id,v){
  APPS[id] = APPS[id]||{events:[]}; APPS[id].status=+v;
  if(+v===1 && !APPS[id].appliedAt) APPS[id].appliedAt = new Date().toLocaleDateString('zh-CN');
  save(); render('jobs');
}

function goJobs(){ document.querySelector('nav a[data-v=jobs]').click(); }
function goApps(f){ curAppFilter=f; document.querySelector('nav a[data-v=apps]').click(); }
function toggleApply(id){ APPS[id]=APPS[id]||{events:[]}; APPS[id].status = APPS[id].status>0?0:1; if(APPS[id].status===1)APPS[id].appliedAt=new Date().toLocaleDateString('zh-CN'); save(); render('dash'); }
function goSched(id){ document.querySelector('nav a[data-v=sched]').click(); }
function addCustom(){

function addOfferImg(id,input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');
      const scale=Math.min(1,1100/img.width);
      cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      APPS[id]=APPS[id]||{events:[]}; APPS[id].imgs=APPS[id].imgs||[];
      APPS[id].imgs.push(cv.toDataURL('image/jpeg',0.72));
      save(); render('apps');
    };
    img.onerror=()=>alert('图片读取失败，换一张试试');
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

function collectEvents(){
  const evs = [];
  ALL_JOBS().forEach(j=>{
    const a = APPS[j.id]; if(!a||a.status===0) return;
    (a.events||[]).forEach(e=>evs.push({date:e.date, label:`${j.c}·${e.type}`, job:j}));
    const d = daysLeft(j.dl);
    if(d!==null&&d>=0) evs.push({date:j.dl.slice(0,10), label:`${j.c}·网申截止`, job:j});
  });
  EVENTS.forEach(e=>{ const m=String(e.date).match(/(\d{4})-(\d{2})-(\d{2})/); if(m) evs.push({date:e.date.slice(0,10), label:e.label+'（手动）', job:{cat:'_manual'}}); });
  return evs.sort((a,b)=>a.date<b.date?-1:1);
}
function detectConflicts(){
  const byDate = {};
  collectEvents().forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e.label); });
  return Object.keys(byDate).filter(d=>byDate[d].length>1)
    .map(d=>({date:d, n:byDate[d].length, items:byDate[d]}));
}
function vSched(){
  const evs = collectEvents();
  const today = new Date();
  const future = evs.filter(e=>{ const m=e.date.match(/(\d{4})-(\d{2})-(\d{2})/); return m && new Date(+m[1],+m[2]-1,+m[3])>=today; });
  const past = evs.filter(e=>!future.includes(e));
  const conf = detectConflicts();
  const confHtml = conf.length ? conf.map(c=>`<div class="alert">🚨 <b>${c.date}</b> 冲突：${c.items.map(esc).join(' ＋ ')}</div>`).join('') : '';
  const soonHtml = future.slice(0,12).map(e=>{
    const m=e.date.match(/(\d{4})-(\d{2})-(\d{2})/);
    const dd = Math.ceil((new Date(+m[1],+m[2]-1,+m[3])-today)/86400000);
    const cat = CATS[e.job.cat]||{color:'#888',name:'自定义'};
    return `<div class="evrow"><span class="evdate" style="color:${dd<=3?'var(--red)':'#333'}">${e.date}（${dd===0?'今天':dd+'天'}）</span>
      <span class="st" style="background:${cat.color};color:#fff">${esc(cat.name)}</span><span>${esc(e.label)}</span></div>`;
  }).join('') || '<div class="empty">暂无日程。在「我的投递」里给岗位添加笔试/面试时间。</div>';
  return `<h2>日程预警</h2><div class="sub">自动汇总已投岗位的考试/面试/截止日期 + 你手动添加的任何提醒；同日多项自动红色预警</div>
    <details class="card" style="margin-bottom:12px"><summary style="cursor:pointer;font-size:13.5px;font-weight:600">✍️ 手动添加日程（面试/考试/体检/任何提醒）</summary>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <input type="date" id="ce-d">
        <input type="text" id="ce-l" placeholder="事项（如：中信一面 / 人才引进面试 / 体检）" style="flex:1;min-width:200px">
        <button class="btn" onclick="addCustomEvent()">添加</button>
      </div>
      ${(EVENTS.length?`<div style="margin-top:10px">${EVENTS.map((e,i)=>`<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;margin-bottom:4px"><span class="evdate">${esc(e.date)}</span><span>${esc(e.label)}</span><span style="color:#aaa;cursor:pointer" onclick="delCustomEvent(${i})">✕</span></div>`).join('')}</div>`:'')}
    </details>
    ${confHtml}<div class="card">${soonHtml}</div>
    ${past.length?`<div class="card"><h3 style="font-size:14px;margin-bottom:6px;color:#999">已过去</h3>${past.map(e=>`<div class="evrow" style="color:#aaa"><span class="evdate">${e.date}</span><span>${esc(e.label)}</span></div>`).join('')}</div>`:''}`;
}

}

  // 多源轮播：每个来源最多占前3条（公告页5条），避免单一来源刷屏
  const cap = n>=99 ? 5 : 3;
  const bySrc = {}, order = [];
  d.items.forEach(it=>{ (bySrc[it.source]=bySrc[it.source]||[]).push(it); if(!order.includes(it.source)) order.push(it.source); });
  const mixed = []; let added = true;
  while(mixed.length < n && added){ added = false;
    for(const s of order){ const arr = bySrc[s]; if(!arr._c) arr._c = 0;
      if(arr._c < Math.min(cap, arr.length)){ mixed.push(arr[arr._c++]); added = true; if(mixed.length>=n) break; }
    }
  }
  return mixed.map(it=>{
    const fresh = (now - new Date(it.date).getTime()) < seven;
    return `<div class="evrow"><span class="evdate">${esc(it.date)}${fresh?' <span style="color:#B71C1C">新</span>':''}</span>
      <span><b style="font-size:12px;color:#1565C0">[${esc(it.source)}]</b> <a href="${esc(it.url)}" target="_blank" style="color:#1565C0">${esc(it.title)}</a></span></div>`;
  }).join('');
}
function vAnn(){
  const d = annData(); if(!d) return '<h2>最新公告</h2><div class="empty">公告数据未加载（部署时需包含 announcements.js）</div>';
  const manual = (d.manualSites||[]).map(s=>`<a class="fbtn" style="text-decoration:none" href="${esc(s.url)}" target="_blank">${esc(s.name)} ↗</a>`).join(' ');
  return `<h2>最新公告</h2><div class="sub">GitHub Actions 每日 8:30 自动抓取 ｜ 上次更新：${esc(d.lastUpdate)} ｜ 共 ${d.total} 条</div>

}

    const w = window.open('', '_blank');
    if(w){ w.document.write('<title>备份JSON-全选复制</title><textarea style="width:100%;height:90vh">'+text.replace(/</g,'&lt;')+'</textarea>'); }
    else alert('剪贴板不可用，请改用「立即导出全部数据备份」下载文件后上传到 GitHub');
  }
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      ['hub-apps','hub-xps','hub-notes','hub-jobstat','hub-customs','hub-gk-mods','hub-gk-mocks','hub-gk-wrong','hub-events'].forEach(k=>{ if(d[k]!==undefined) localStorage.setItem(k,JSON.stringify(d[k])); });
      alert('导入成功，页面即将刷新'); location.reload();
    }catch(e){ alert('文件格式不对，请选择「导出」生成的 json 文件'); }
  };
  r.readAsText(f);
}

function afterRender(v){ window.scrollTo(0,0); }
render('dash');
/* ================= 云端备份自动恢复（backup.json · 仅新浏览器首次生效，不覆盖本地已有数据） ================= */
(async ()=>{ try{
  const r = await fetch('backup.json',{cache:'no-store'});
  if(!r.ok) return;
  const d = await r.json(); let changed=false;
  ['hub-apps','hub-xps','hub-notes','hub-jobstat','hub-customs','hub-gk-mods','hub-gk-mocks','hub-gk-wrong','hub-events'].forEach(k=>{
    if(localStorage.getItem(k)===null && d[k]!==undefined){ localStorage.setItem(k,JSON.stringify(d[k])); changed=true; }
  });
  if(changed) location.reload();
}catch(e){} })();
</script>
