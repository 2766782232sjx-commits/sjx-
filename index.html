/* ================= 岗位综合匹配分（搜索排序模型） ================= */
function payMid(p){ const s=String(p); const m=s.match(/(\d+)[-–~](\d+)/); if(m) return (+m[1]+ +m[2])/2; const one=s.match(/(\d+)/); return one?+one[1]:12; }
function scoreParts(j){
  const txt = (j.pro||'')+(j.con||'');
  return {
    fit: Math.round(j.fit/5*40),
    pay: Math.round(Math.min(payMid(j.pay),60)/60*30),
    growth: /名额极少|名额更少|晋升慢|晋升难/.test(j.con||'') ? 4 : (/晋升|培养|管培|轮岗|通道|储备|扩编/.test(j.pro||'') ? 13 : 8),
    mob: (/收护照|护照上交|管理严格/.test(txt)?-8:0) + (/外派|驻外|全球|国际/.test(j.pro||'')?7:0) + (/英语|语言|雅思|英文/.test((j.pro||'')+(j.req||''))?4:0)
  };
}
function jobScore(j){ const s=scoreParts(j); return Math.round(s.fit+s.pay+s.growth+s.mob) + ((daysLeft(j.dl)??1)<0 ? -8 : 0); }
function catStrategyHtml(){
  const s = (typeof CAT_STRATEGY!=='undefined') && CAT_STRATEGY[curCat];

  return `<div class="card" style="border-left:4px solid ${CATS[curCat].color};margin-bottom:12px;background:linear-gradient(135deg,#f6f9ff,#fff)"><h3 style="font-size:14px;margin-bottom:6px">🎯 ${CATS[curCat].name} · 备考策略</h3><div style="font-size:12.5px;color:#333;line-height:2"><div>📚 <b>先备好：</b>${esc(s.books)}</div><div>🗓 <b>节奏：</b>${esc(s.plan)}</div><div>⚔️ <b>你的打法：</b>${esc(s.edge)}</div></div></div>`;
}

function jobListHtml(){

  const q = (JOBSTAT.__q||'').trim();
  if(q) list = list.filter(j=>(j.c+j.r+j.req+(j.base||'')).includes(q));
  const payMin = p => { const m=String(p).match(/(\d+)[-–]/); return m?+m[1]:0; };
  if(curSort==='score') list.sort((a,b)=>jobScore(b)-jobScore(a));
  if(curSort==='dl') list.sort((a,b)=>(daysLeft(a.dl)??999)-(daysLeft(b.dl)??999));
  if(curSort==='fit') list.sort((a,b)=>b.fit-a.fit);
  if(curSort==='pay') list.sort((a,b)=>payMin(b.pay)-payMin(a.pay));
  if(!list.length) return '<div class="empty">没有匹配的岗位</div>';
  return list.map(j=>{
    const cat = CATS[j.cat], d = daysLeft(j.dl), st = APPS[j.id]?.status||0;
    const dlHtml = d===null ? esc(j.dlNote||j.dl) :
      d<0 ? `<span style="color:#999">已过期(参考)</span>` :
      `<span class="${d<=14?'dl-soon':''}">${j.dl}（剩${d}天）</span>`;
    return `<div class="job" style="--jc:${cat.color}" onclick="this.classList.toggle('open')">
      <div class="top"><span class="comp">${esc(j.c)}</span><span class="role">${esc(j.r)}</span>
        <span class="cat-tag">${cat.name}</span><span class="fit">${'★'.repeat(j.fit)}${'☆'.repeat(5-j.fit)}</span>
        <span class="cat-tag" style="background:#1d1d1f">🎯 ${jobScore(j)}分</span>
        ${/外派|驻外|海外派驻|常驻海外|接受出国|全球轮岗|海外基地/.test((j.pro||'')+(j.req||'')+(j.r||''))?`<span class="cat-tag" style="background:#0277BD">✈ 外派</span>`:''}

      ${j.flag?`<div class="meta" style="color:#B71C1C;background:#fdf0ef;border-radius:8px;padding:4px 8px;margin-top:4px">${esc(j.flag)}</div>`:''}
      <div class="detail">
        <p><span class="lb">报名条件</span>${esc(j.req)}</p>
        <p><span class="lb">考试安排</span>${esc(j.examInfo)}</p>
        <p><span class="lb">投递通道</span><a href="${j.url.startsWith('http')?j.url:'javascript:void(0)'}" ${j.url.startsWith('http')?'target="_blank"':''} style="color:#1565C0">${esc(j.url)}</a> <span style="color:#999;font-size:12px">（${esc(j.src)}）</span></p>
        <p><span class="lb">待遇</span>${esc(j.pay)}</p>
        <p><span class="lb">匹配分</span><b>${jobScore(j)}</b>＝契合度${scoreParts(j).fit}+薪资${scoreParts(j).pay}+成长${scoreParts(j).growth}+语言外派${scoreParts(j).mob}${(daysLeft(j.dl)??1)<0?'−已截止8':''}（满分约94，仅作排序参考）</p>

function setStatus(id,v){
  APPS[id] = APPS[id]||{events:[]}; APPS[id].status=+v;
  if(+v===1 && !APPS[id].appliedAt) APPS[id].appliedAt = new Date().toLocaleDateString('zh-CN');

function addOfferImg(id,input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');
      const scale=Math.min(1,1100/img.width);
      cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      APPS[id]=APPS[id]||{events:[]}; APPS[id].imgs=APPS[id].imgs||[];
      APPS[id].imgs.push(cv.toDataURL('image/jpeg',0.72));
      save(); render('apps');
    };
    img.onerror=()=>alert('图片读取失败，换一张试试');
    img.src=r.result;
  };
  r.readAsDataURL(f);
}
function delOfferImg(id,i){ APPS[id].imgs.splice(i,1); save(); render('apps'); }

/* ================= 日程预警 ================= */
function collectEvents(){
  const evs = [];
  ALL_JOBS().forEach(j=>{
    const a = APPS[j.id]; if(!a||a.status===0) return;
    (a.events||[]).forEach(e=>evs.push({date:e.date, label:`${j.c}·${e.type}`, job:j}));
    const d = daysLeft(j.dl);
    if(d!==null&&d>=0) evs.push({date:j.dl.slice(0,10), label:`${j.c}·网申截止`, job:j});
  });
  EVENTS.forEach(e=>{ const m=String(e.date).match(/(\d{4})-(\d{2})-(\d{2})/); if(m) evs.push({date:e.date.slice(0,10), label:e.label+'（手动）', job:{cat:'_manual'}}); });
  return evs.sort((a,b)=>a.date<b.date?-1:1);
}
function detectConflicts(){
  const byDate = {};
  collectEvents().forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e.label); });
  return Object.keys(byDate).filter(d=>byDate[d].length>1)
    .map(d=>({date:d, n:byDate[d].length, items:byDate[d]}));
}
function vSched(){
  const evs = collectEvents();
  const today = new Date();
  const future = evs.filter(e=>{ const m=e.date.match(/(\d{4})-(\d{2})-(\d{2})/); return m && new Date(+m[1],+m[2]-1,+m[3])>=today; });
  const past = evs.filter(e=>!future.includes(e));
  const conf = detectConflicts();
  const confHtml = conf.length ? conf.map(c=>`<div class="alert">🚨 <b>${c.date}</b> 冲突：${c.items.map(esc).join(' ＋ ')}</div>`).join('') : '';
  const soonHtml = future.slice(0,12).map(e=>{
    const m=e.date.match(/(\d{4})-(\d{2})-(\d{2})/);
    const dd = Math.ceil((new Date(+m[1],+m[2]-1,+m[3])-today)/86400000);
    const cat = CATS[e.job.cat]||{color:'#888',name:'自定义'};
    return `<div class="evrow"><span class="evdate" style="color:${dd<=3?'var(--red)':'#333'}">${e.date}（${dd===0?'今天':dd+'天'}）</span>
      <span class="st" style="background:${cat.color};color:#fff">${esc(cat.name)}</span><span>${esc(e.label)}</span></div>`;
  }).join('') || '<div class="empty">暂无日程。在「我的投递」里给岗位添加笔试/面试时间。</div>';
  return `<h2>日程预警</h2><div class="sub">自动汇总已投岗位的考试/面试/截止日期 + 你手动添加的任何提醒；同日多项自动红色预警</div>
    <details class="card" style="margin-bottom:12px"><summary style="cursor:pointer;font-size:13.5px;font-weight:600">✍️ 手动添加日程（面试/考试/体检/任何提醒）</summary>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <input type="date" id="ce-d">
        <input type="text" id="ce-l" placeholder="事项（如：中信一面 / 人才引进面试 / 体检）" style="flex:1;min-width:200px">
        <button class="btn" onclick="addCustomEvent()">添加</button>
      </div>
      ${(EVENTS.length?`<div style="margin-top:10px">${EVENTS.map((e,i)=>`<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;margin-bottom:4px"><span class="evdate">${esc(e.date)}</span><span>${esc(e.label)}</span><span style="color:#aaa;cursor:pointer" onclick="delCustomEvent(${i})">✕</span></div>`).join('')}</div>`:'')}
    </details>
    ${confHtml}<div class="card">${soonHtml}</div>
    ${past.length?`<div class="card"><h3 style="font-size:14px;margin-bottom:6px;color:#999">已过去</h3>${past.map(e=>`<div class="evrow" style="color:#aaa"><span class="evdate">${e.date}</span><span>${esc(e.label)}</span></div>`).join('')}</div>`:''}`;
}

function storageUsage(){

  const names={'hub-apps':'投递状态','hub-xps':'经验贴','hub-notes':'随手记','hub-jobstat':'岗位备注','hub-customs':'自建岗位','hub-gk-mods':'考公进度','hub-gk-mocks':'模考记录','hub-events':'手动日程'};

}

  const xpRows=XPS.map((x,i)=>`<div class="evrow"><span style="flex:1"><b>${esc(x.t)}</b> <span style="color:#999;font-size:12px">${esc(x.src||'')}${x.time?' · 发帖时间:'+esc(x.time):''}${x.saved?' · 记录于'+esc(x.saved):''}</span>${x.note?`<div style="color:#666;font-size:12px">${esc(x.note)}</div>`:''}${x.url?`<div style="font-size:12px"><a href="${esc(x.url)}" target="_blank" style="color:#1565C0">${esc(x.url)}</a></div>`:''}</span><span style="color:#aaa;cursor:pointer" onclick="delXp(${i})">✕</span></div>`).join('')||'<div class="empty">空</div>';
  const noteRows=NOTES.map((n,i)=>`<div class="evrow"><span style="flex:1"><b style="color:#5D4037">${esc(n.cat)}</b> ${esc(n.text)}<div style="color:#999;font-size:12px">${esc(n.date||'')}</div></span><span style="color:#aaa;cursor:pointer" onclick="delNote(${i})">✕</span></div>`).join('')||'<div class="empty">空</div>';
  const evRows=EVENTS.length?EVENTS.map((e,i)=>`<div class="evrow"><span class="evdate">${esc(e.date)}</span><span style="flex:1">${esc(e.label)}</span><span style="color:#aaa;cursor:pointer" onclick="delCustomEvent(${i})">✕</span></div>`).join(''):'<div class="empty">还没有手动日程（自动的截止/考试日在「日程预警」页）</div>';
  return `<h2>档案室</h2><div class="sub">你所有记录的总仓库：过往全部投递（含已挂/历史）、经验贴、随手记、手动日程，一眼看尽</div>
    <div class="card" style="border-left:4px solid #2E7D32"><h3 style="font-size:14px;margin-bottom:6px">💾 存储状态与上限说明</h3>
      <div style="font-size:12.5px;color:#444;line-height:1.9">
      浏览器给每个网站的本地存储上限约 <b>5MB</b>（纯文本，约250万字）。你现在用了 <b>${fmtKB(u.total)}</b>，占上限 <b>${pct.toFixed(2)}%</b>——按一年高强度记录估算也只用到1-2%，<b>使用一年完全够</b>。保险起见每月点一次「导出」存份JSON到云盘即可高枕无忧；存储真满时保存会弹窗提醒你。
      <div style="background:#eee;border-radius:6px;height:10px;margin:8px 0;overflow:hidden"><div style="width:${Math.max(0.5,pct)}%;height:100%;background:${barColor}"></div></div>
      ${u.rows.map(r=>`<span style="display:inline-block;margin:2px 10px 2px 0;font-size:12px;color:#666">${r.n}: ${fmtKB(r.s)}</span>`).join('')}
      <div style="margin-top:8px"><button class="btn small" onclick="exportData()">⬇️ 立即导出全部数据备份</button></div></div></div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">📬 投递全记录（${all.length}条，含已挂/历史）</h3>${appRows}</div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">📚 经验贴全记录（${XPS.length}条）</h3>${xpRows}</div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">🗒 随手记全记录（${NOTES.length}条）</h3>${noteRows}</div>

}

/* ================= 最新公告（每日自动抓取） ================= */
function annData(){ return (typeof ANNOUNCEMENTS_DATA!=='undefined') ? ANNOUNCEMENTS_DATA : null; }
function annListHtml(n){
  const d = annData(); if(!d) return '<div class="empty">公告数据未加载</div>';
  const seven = 7*86400000, now = Date.now();
  // 多源轮播：每个来源最多占前3条（公告页5条），避免单一来源刷屏
  const cap = n>=99 ? 5 : 3;
  const bySrc = {}, order = [];
  d.items.forEach(it=>{ (bySrc[it.source]=bySrc[it.source]||[]).push(it); if(!order.includes(it.source)) order.push(it.source); });
  const mixed = []; let added = true;
  while(mixed.length < n && added){ added = false;
    for(const s of order){ const arr = bySrc[s]; if(!arr._c) arr._c = 0;
      if(arr._c < Math.min(cap, arr.length)){ mixed.push(arr[arr._c++]); added = true; if(mixed.length>=n) break; }
    }
  }
  return mixed.map(it=>{
    const fresh = (now - new Date(it.date).getTime()) < seven;
    return `<div class="evrow"><span class="evdate">${esc(it.date)}${fresh?' <span style="color:#B71C1C">新</span>':''}</span>
      <span><b style="font-size:12px;color:#1565C0">[${esc(it.source)}]</b> <a href="${esc(it.url)}" target="_blank" style="color:#1565C0">${esc(it.title)}</a></span></div>`;
  }).join('');
}
function vAnn(){
  const d = annData(); if(!d) return '<h2>最新公告</h2><div class="empty">公告数据未加载（部署时需包含 announcements.js）</div>';
  const manual = (d.manualSites||[]).map(s=>`<a class="fbtn" style="text-decoration:none" href="${esc(s.url)}" target="_blank">${esc(s.name)} ↗</a>`).join(' ');
  return `<h2>最新公告</h2><div class="sub">GitHub Actions 每日 8:30 自动抓取 ｜ 上次更新：${esc(d.lastUpdate)} ｜ 共 ${d.total} 条</div>
    <div class="card">${annListHtml(99)}</div>
    <div class="card"><h3 style="font-size:14px;margin-bottom:8px">🖐 需手动查看的入口（网申/反爬站点）</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${manual}</div></div>`;
}

/* ================= 考公备战 ================= */
const GK_TARGETS = [

  {n:'京考笔试', d:'2026-12-13'},

];
const GK_MODS = ['资料分析','言语理解','判断推理','数量关系','常识判断'];
function vGk(){

    return `<div class="stat"><div class="n" style="color:${dd!==null&&dd<=60?'var(--red)':'#222'}">${dd===null?'—':dd+'天'}</div><div class="l">${t.n}<br>${t.d}（参考）</div></div>`; }).join('');
  const modRows = GK_MODS.map(m=>{
    const st=GKMODS[m]||{}, acc=parseFloat(st.acc);

    return `<tr><td style="padding:8px 6px;font-weight:600">${m}</td>
      <td style="padding:8px 6px"><input type="number" min="0" style="width:100px" placeholder="已刷题数" value="${st.done??''}" onchange="gkSetMod('${m}','done',this.value)"></td>
      <td style="padding:8px 6px"><input type="text" style="width:80px" placeholder="正确率%" value="${st.acc??''}" onchange="gkSetMod('${m}','acc',this.value)"></td>
      <td style="padding:8px 6px">${lv}</td></tr>`; }).join('');
  const mockRows = GKMOCKS.length ? GKMOCKS.map((m,i)=>`
    <tr><td style="padding:8px 6px">${esc(m.date)}</td><td style="padding:8px 6px">${esc(m.name)}</td>
      <td style="padding:8px 6px;font-weight:700;color:${m.xz>=75?'#1e7e34':m.xz>=65?'#B8860B':'#B71C1C'}">${m.xz??'—'}</td>
      <td style="padding:8px 6px;font-weight:700;color:${m.sl>=60?'#1e7e34':m.sl>=50?'#B8860B':'#B71C1C'}">${m.sl??'—'}</td>
      <td style="padding:8px 6px;font-size:12px;color:#555">${esc(m.note||'')}</td>
      <td style="padding:8px 6px"><span style="color:#aaa;cursor:pointer" onclick="gkDelMock(${i})">✕</span></td></tr>`).join('')
    : '<tr><td colspan="6" style="padding:16px;text-align:center;color:#999">还没有模考记录：粉笔模考/真题卷都记进来，进步靠积累</td></tr>';
  return `<h2>考公备战</h2><div class="sub">行测模块进度 + 模考成绩 + 关键节点倒计时（日期参考历年，以当年公告为准）</div>
    <div class="card" style="border-left:4px solid #B71C1C;background:linear-gradient(135deg,#fff5f5,#fff)"><h3 style="font-size:14px;margin-bottom:6px">🎬 零基础三阶段路线（从0开始就这么走）</h3><div style="font-size:12.5px;color:#333;line-height:2"><div><b>① 基础期（第1-6周）：</b>粉笔980系统班把行测五大模块过一遍（资料分析/言语/判断优先），申论先看半月谈+人民日报评论找语感</div><div><b>② 强化期（第7-12周）：</b>资料分析跟花生十三把正确率提到90%+，每天1组行测+隔天1篇申论大作文（用你的论文功底）</div><div><b>③ 冲刺期（考前4周）：</b>国考/京考历年真题整套限时刷+错题本复盘；这套备考同时服务选调/央企/事业编笔试，一鱼多吃</div><div>📌 <b>你占便宜的地方：</b>申论=你的写稿本行；国关属政治学类，事业单位选B类卷（综合应用=社科写作），备考成本比行测低一档</div></div></div>
    <div class="grid g4" style="margin-bottom:14px">${cards}</div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">📊 行测五大模块 · 刷题进度与正确率</h3>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:2px solid var(--line);color:#999;font-size:12px"><th align="left" style="padding:6px">模块</th><th align="left" style="padding:6px">已刷题数</th><th align="left" style="padding:6px">正确率%</th><th align="left" style="padding:6px">状态</th></tr></thead>
        <tbody>${modRows}</tbody></table></div>
      <div style="font-size:12px;color:#999;margin-top:6px">输入即自动保存。资料分析性价比最高（优先拉到85%+）；数量关系可战略性放弃。</div></div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">📝 模考记录</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <input type="date" id="gk-d">
        <input type="text" id="gk-n" placeholder="模考名称（粉笔第X季/国考真题卷）" style="flex:1;min-width:180px">
        <input type="number" id="gk-xz" placeholder="行测分" style="width:90px">
        <input type="number" id="gk-sl" placeholder="申论分" style="width:90px">
        <input type="text" id="gk-note" placeholder="反思一句话（可选）" style="flex:1;min-width:160px">
        <button class="btn" onclick="gkAddMock()">记录</button>
      </div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:2px solid var(--line);color:#999;font-size:12px"><th align="left" style="padding:6px">日期</th><th align="left" style="padding:6px">模考</th><th align="left" style="padding:6px">行测</th><th align="left" style="padding:6px">申论</th><th align="left" style="padding:6px">反思</th><th></th></tr></thead>
        <tbody>${mockRows}</tbody></table></div></div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:8px">💡 备考节奏（秋招+考公两线并行）</h3>
      <div style="font-size:13px;color:#444;line-height:1.9">
        ① 现在-10月：秋招是主线，行测只做<b>资料分析</b>（每天1组20题保手感），其余靠央企笔试真题带练；<br>
        ② 10月-11月中：面试间隙刷<b>言语+判断</b>，正确率拉到75%+；<br>
        ③ 11月中-国考前：两套真题卷全真模考，申论直接用国关写作功底转化；<br>
        ④ 数量关系目标60%即可；常识判断不用专门复习，政治素养底子够。</div></div>`;
}
function gkSetMod(m,k,v){ GKMODS[m]=GKMODS[m]||{}; GKMODS[m][k]=v; save(); render('gk'); }
function gkAddMock(){
  const d=$('#gk-d').value, n=$('#gk-n').value.trim();
  if(!d||!n) return alert('请填日期和模考名称');
  GKMOCKS.unshift({date:d, name:n, xz:$('#gk-xz').value||null, sl:$('#gk-sl').value||null, note:$('#gk-note').value.trim()});
  save(); render('gk');
}
function gkDelMock(i){ GKMOCKS.splice(i,1); save(); render('gk'); }

/* ================= 数据导出/导入（跨设备迁移） ================= */
function exportData(){
  const payload = {exportedAt:new Date().toLocaleString('zh-CN'),
    'hub-apps':LS.get('hub-apps',{}),'hub-xps':LS.get('hub-xps',[]),
    'hub-notes':LS.get('hub-notes',[]),'hub-jobstat':LS.get('hub-jobstat',{}),
    'hub-customs':LS.get('hub-customs',[]),'hub-gk-mods':LS.get('hub-gk-mods',{}),'hub-gk-mocks':LS.get('hub-gk-mocks',[]),'hub-events':LS.get('hub-events',[])};
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '我的未来式我做主备份-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      ['hub-apps','hub-xps','hub-notes','hub-jobstat','hub-customs','hub-gk-mods','hub-gk-mocks','hub-events'].forEach(k=>{ if(d[k]!==undefined) localStorage.setItem(k,JSON.stringify(d[k])); });
      alert('导入成功，页面即将刷新'); location.reload();
    }catch(e){ alert('文件格式不对，请选择「导出」生成的 json 文件'); }
  };
  r.readAsText(f);
}

function afterRender(v){ window.scrollTo(0,0); }
render('dash');
