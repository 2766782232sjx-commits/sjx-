name: 每日更新招聘公告

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30，每天自动运行
    - cron: '30 0 * * *'
  workflow_dispatch: {}   # 支持在 GitHub 网页上手动点击运行

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖（requests / bs4 / playwright）
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: 抓取 JS 渲染站点（中信/中化学，失败不中断）
        run: python crawler_js.py || true

      - name: 抓取 SSR 站点并合并输出
        run: python crawler.py

      - name: 有更新才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add announcements.js
          if git diff --cached --quiet; then
            echo "今天没有新公告，跳过提交"
          else
            git commit -m "每日更新公告 $(date -u +%Y-%m-%d)"
            git push
          fi
